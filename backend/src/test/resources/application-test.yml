spring:
  datasource:
    url: jdbc:h2:mem:weddingplanner-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true

app:
  bootstrap:
    admin-email: bootstrap-admin@example.com
    admin-password: bootstrap-password
  plan-archive-retention-days: 30
  public-rsvp:
    token: test-public-rsvp-token
    actor-email: public-rsvp-test@system.local
    actor-display-name: Public RSVP Test
