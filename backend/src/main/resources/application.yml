
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wedding_planner
    username: wedding
    password: wedding
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true

app:
  plan-archive-retention-days: 90
  public-rsvp:
    token: ${PUBLIC_RSVP_TOKEN:}
    actor-email: ${PUBLIC_RSVP_ACTOR_EMAIL:public-rsvp@system.local}
    actor-display-name: ${PUBLIC_RSVP_ACTOR_NAME:Public RSVP}
